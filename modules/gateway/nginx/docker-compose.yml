# 官方出处（验收依据）:
#   Docker Hub: https://hub.docker.com/_/nginx
#   上游: https://github.com/nginx/nginx
#   配置指南: https://nginx.org/en/docs/
#   反代: https://nginx.org/en/docs/http/ngx_http_proxy_module.html
#   WebSocket: https://nginx.org/en/docs/http/websocket.html
#   HTTPS: https://nginx.org/en/docs/http/configuring_https_servers.html
#   本仓库: docs/nginx/README.md
# 最小可跑: 官方默认欢迎页；宿主机 8088->80（避开常见 80 占用）
# 挂载约束: ./conf/nginx.conf 必须是文件；./conf/conf.d 必须是目录。
#   宿主机文件路径不存在时 Docker 会建成目录，再挂到容器内文件会报 OCI mount failed。

services:
  nginx:
    image: nginx:1.27.4
    container_name: nginx
    restart: always
    ports:
      - "8088:80"
      # [ports] HTTPS 示例 建议: "8443:443" — 启用 ssl.conf 时取消注释
      # - "8443:443"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      # [挂载 conf] 建议: ./conf/nginx.conf — 官方 1.27.4 主配置（必须是文件）
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      # [挂载 conf] 建议: ./conf/conf.d — 官方 include 目录；内含 default/反代/WS/TLS 示例
      - ./conf/conf.d:/etc/nginx/conf.d:ro
      # [挂载] TLS 证书目录 建议: ./certs:/etc/nginx/certs:ro
      # - ./certs:/etc/nginx/certs:ro
    # [environment] 时区等非官方核心项可按需加
    # environment:
    #   TZ: Asia/Shanghai
    # [command] 测试配置: nginx -t（进入容器执行）
