# 官方出处（验收依据）:
#   Docker 安装: https://docs.gitlab.com/ee/install/docker/
#   Docker Hub: https://hub.docker.com/r/gitlab/gitlab-ce
#   上游仓库（Omnibus）: https://gitlab.com/gitlab-org/omnibus-gitlab
#   产品仓库: https://gitlab.com/gitlab-org/gitlab
# 详解与踩坑: docs/gitlab/pitfalls.md

services:
  gitlab:
    image: gitlab/gitlab-ce:18.9.2-ce.0
    container_name: gitlab
    restart: always
    # 修改成你的IP地址
    hostname: 'YOUR_IP_ADDRESS'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # 修改成你的IP地址
        external_url 'http://YOUR_IP_ADDRESS:5401'
        gitlab_rails['gitlab_shell_ssh_port'] = 5403
        gitlab_rails['time_zone'] = 'Asia/Shanghai'
    ports:
      - '5401:5401'
      - '5403:22'
    volumes:
      - './config:/etc/gitlab'
      - './logs:/var/log/gitlab'
      - './data:/var/opt/gitlab'
    shm_size: '256m'