# MinIO Nginx 反代片段
# 用法: include 到 http{} 内，或复制 server{} 到站点配置
# 将 s3.example.com / console.example.com 换成实际域名
# 配合 compose 中按需取消注释:
#   MINIO_SERVER_URL=https://s3.example.com
#   MINIO_BROWSER_REDIRECT_URL=https://console.example.com
# 参考: https://min.io/docs/minio/linux/integrations/setup-nginx-proxy-with-minio.html

upstream minio_s3 {
    server 127.0.0.1:9000;
}

upstream minio_console {
    server 127.0.0.1:9001;
}

# S3 API
server {
    listen 80;
    server_name s3.example.com;

    # 大文件上传（按需调整；0 表示不限制）
    client_max_body_size 0;
    ignore_invalid_headers off;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

        proxy_pass http://minio_s3;
    }
}

# Web Console（需 WebSocket）
server {
    listen 80;
    server_name console.example.com;

    client_max_body_size 0;
    ignore_invalid_headers off;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        chunked_transfer_encoding off;

        proxy_pass http://minio_console;
    }
}
