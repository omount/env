# 官方出处（验收依据）:
#   https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/
#   https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#override-configuration-with-environment-variables
#   https://hub.docker.com/r/grafana/grafana （tag 11.5.2）
#   上游仓库: https://github.com/grafana/grafana
# 环境变量使用官方 GF_ 前缀覆盖 grafana.ini
# 宿主机端口 3001→3000：避开本仓库 openwebui(3000)；官方示例多为 3000:3000
# 演示账号: admin / 123456（EsayEnv 密码递进）

services:
  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "123456"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 按需取消注释
      # GF_SERVER_ROOT_URL: "http://127.0.0.1:3001"
      # GF_INSTALL_PLUGINS: ""
      # GF_LOG_LEVEL: info
    ports:
      - "3001:3000"
    volumes:
      - ./data:/var/lib/grafana
