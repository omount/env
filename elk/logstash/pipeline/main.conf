# 管道目录挂载方式见官方:
# https://www.elastic.co/guide/en/logstash/8.17/docker-config.html
# Elasticsearch output 参数见官方（8.17）:
# https://www.elastic.co/guide/en/logstash/8.17/plugins-outputs-elasticsearch.html
# 使用 ssl_certificate_authorities（官方现行项）；cacert 已 Deprecated in 11.14.0

input {
  heartbeat {
    interval => 30
    message => "esayenv-elk-heartbeat"
  }
}

filter {
  mutate {
    add_field => { "[@metadata][target_index]" => "esayenv-heartbeat" }
  }
}

output {
  elasticsearch {
    hosts => ["https://es01:9200"]
    user => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    index => "%{[@metadata][target_index]}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
  }
}
